apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mindx-app-tls
  namespace: mindx-app
  labels:
    app: mindx-app
spec:
  secretName: mindx-app-tls-secret
  duration: 2160h # 90 days
  renewBefore: 360h # Renew 15 days before expiry

  subject:
    organizations:
      - MindX Technology & Startup School

  commonName: hieunh01.mindx.edu.vn

  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io

  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
    rotationPolicy: Always

  usages:
    - digital signature
    - key encipherment
    - server auth
