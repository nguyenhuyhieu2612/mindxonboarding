apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: mindx-app
type: Opaque
stringData:
  OIDC_CLIENT_ID: "mindx-onboarding"
  OIDC_CLIENT_SECRET: "your-client-secret-here"
  JWT_SECRET: "generate-strong-jwt-secret"
  ACCESS_TOKEN_SECRET: "generate-strong-access-token-secret"
  REFRESH_TOKEN_SECRET: "generate-strong-refresh-token-secret"
  REDIS_PASSWORD: "your-redis-password"
