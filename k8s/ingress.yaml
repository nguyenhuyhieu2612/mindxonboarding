# Backend Ingress - with path rewrite
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mindx-backend-ingress
  namespace: mindx-app
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 3000
---
# Frontend Ingress - no path rewrite
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mindx-frontend-ingress
  namespace: mindx-app
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 5173
