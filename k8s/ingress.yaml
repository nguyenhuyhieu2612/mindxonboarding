apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mindx-ingress
  namespace: mindx-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  spec:
    ingressClassName: nginx
    rules:
      - host: example.com
        http:
          paths:
            - path: /api/(.*)
              pathType: Prefix
              backend:
                service:
                  name: backend-service
                  port:
                    number: 3000
            - path: /(.*)
              pathType: Prefix
              backend:
                service:
                  name: frontend-service
                  port:
                    number: 8080
